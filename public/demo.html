<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafeVoice · Live demo</title>
  <link rel="icon" href="/logo.svg">
  <link rel="stylesheet" href="/base.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }
    .bar { display: flex; align-items: center; gap: 18px; padding: 16px 28px 12px; border-bottom: 1px solid var(--line); margin: 0 28px; padding-left: 0; padding-right: 0; flex-wrap: wrap; }
    .bar .eyebrow { margin-left: 4px; }
    .grow { flex: 1; }
    .ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
    .stage { flex: 1; display: flex; flex-direction: column; padding: 20px 28px 16px; min-height: 0; }
    .dash { border-radius: 20px; overflow: hidden; min-height: 560px; flex: 1; }
    .dash iframe { width: 100%; height: 100%; border: 0; display: block; }
    .foot { margin: 0 28px 12px; text-align: right; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="bar">
    <span class="brand"><img src="/logo.svg" alt="" width="22" height="22"> Safe<em>Voice</em></span>
    <span class="eyebrow">The demo — live</span>
    <span class="grow"></span>
    <a class="ghost" href="/pitch" style="text-decoration:none;color:inherit">Pitch video</a>
  </div>

  <div class="stage">
    <div class="dash"><iframe id="dash" src="/counsellor" title="Counsellor dashboard"></iframe></div>
  </div>
  <p class="foot">Demo · All data is fictional</p>
</body>
</html>
