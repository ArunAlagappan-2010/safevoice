<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafeVoice · Live demo</title>
  <link rel="icon" href="/logo.svg">
  <link rel="stylesheet" href="/base.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }
    .bar { display: flex; align-items: center; gap: 18px; padding: 16px 28px 12px; border-bottom: 1px solid var(--line); margin: 0 28px; padding-left: 0; padding-right: 0; flex-wrap: wrap; }
    .bar .eyebrow { margin-left: 4px; }
    .grow { flex: 1; }
    .scen { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .scen span { font-size: 12px; color: var(--muted); font-weight: 600; }
    .scen button, .ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
    .scen button:hover { background: var(--teal-soft); border-color: var(--teal); }
    .scen button.hot { border-color: var(--rose); color: var(--rose-2); }
    .scen button.hot:hover { background: var(--rose-soft); }
    .stage { flex: 1; display: grid; grid-template-columns: auto 1fr; gap: 28px; padding: 20px 28px 16px; align-items: stretch; min-height: 0; }
    .left { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .phone { width: 360px; height: min(740px, calc(100vh - 230px)); min-height: 560px; border: 10px solid var(--ink-2); border-radius: 46px; overflow: hidden; position: relative; background: var(--bg); box-shadow: 0 30px 60px -30px rgba(0,0,0,.45); }
    .phone::before { content: ''; position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 92px; height: 24px; background: var(--ink-2); border-radius: 999px; z-index: 2; }
    .phone iframe { width: 100%; height: 100%; border: 0; }
    .join { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 0; box-shadow: var(--shadow); border-radius: 14px; padding: 10px 12px; width: 360px; }
    .join .qr { line-height: 0; flex: none; }
    .join .qr:empty { display: none; }
    .join b { font-family: var(--serif); font-size: 17px; display: block; }
    .join .url { font-family: var(--mono); font-size: 12px; word-break: break-all; color: var(--teal); }
    .join small { color: var(--muted); font-size: 11px; display: block; margin-top: 2px; }
    .dash { border-radius: 20px; overflow: hidden; min-height: 560px; }
    .dash iframe { width: 100%; height: 100%; border: 0; display: block; }
    .foot { margin: 0 28px 12px; text-align: right; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    @media (max-width: 1100px) { .stage { grid-template-columns: 1fr; } .dash { height: 800px; } }
  </style>
</head>
<body>
  <div class="bar">
    <span class="brand"><img src="/logo.svg" alt="" width="22" height="22"> Safe<em>Voice</em></span>
    <span class="eyebrow">The demo — live</span>
    <span class="grow"></span>
    <div class="scen" aria-label="Demo scenarios">
      <span>Try a scenario:</span>
      <button data-s="0">Repeated harassment</button>
      <button data-s="1">Exclusion</button>
      <button data-s="2">தமிழ் · Caste bullying</button>
      <button data-s="3" class="hot">Safety concern</button>
    </div>
    <a class="ghost" href="/pitch" style="text-decoration:none;color:inherit">Pitch video</a>
  </div>

  <div class="stage">
    <div class="left">
      <div class="phone"><iframe id="phone" src="/?embed=1" title="Student app"></iframe></div>
      <div class="join">
        <div class="qr" id="qr"></div>
        <div>
          <b>Try it on your phone</b>
          <span class="url" id="url"></span>
          <small id="wifiLine">Same Wi-Fi. No app. No login.</small>
        </div>
      </div>
    </div>
    <div class="dash"><iframe id="dash" src="/counsellor" title="Counsellor dashboard"></iframe></div>
  </div>
  <p class="foot">Demo · All data is fictional</p>

  <script src="/vendor/qrcode.js"></script>
  <script src="/qr.js"></script>
  <script>
    const SCENARIOS = [
      { text: "Some students keep mocking me near the Class 9 corridor at lunch. I'm scared to go there anymore.", location: 'Corridor', time: 'Lunch' },
      { text: "The girls in my class won't let me sit with them and tell everyone not to talk to me. It still happens every day.", location: 'Classroom', time: 'Morning' },
      { text: 'தினமும் மதிய உணவு நேரத்தில் சில மாணவர்கள் என் சாதியைப் பற்றி கேலி செய்கிறார்கள். எனக்கு பயமாக இருக்கிறது.', location: 'Canteen', time: 'Lunch', lang: 'ta' },
      { text: 'A senior told me he will bring a knife tomorrow and hurt me after school. I am really scared and I do not know what to do.', location: 'Playground', time: 'After school', helpNow: true },
    ];
    document.querySelectorAll('[data-s]').forEach((b) => b.addEventListener('click', () => {
      const s = SCENARIOS[b.dataset.s];
      const win = document.getElementById('phone').contentWindow;
      win.SafeVoiceDemo?.fill({ lang: 'en', ...s });
    }));
    fetch('/api/info').then((r) => r.json()).then(({ network: n }) => {
      document.getElementById('url').textContent = n.studentUrl;
      SVQR.renderQR(document.getElementById('qr'), n.studentUrl, { size: 84 });
      if (n.ssid) document.getElementById('wifiLine').textContent = `Wi-Fi "${n.ssid}" · password ${n.password} · no internet needed`;
    });
  </script>
</body>
</html>
